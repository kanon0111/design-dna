<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生成案の比較</title>
<style>
/* 比較用の画面。デザイン案そのものではないので中立なグレーにする */
*{box-sizing:border-box}
body{margin:0;padding:30px 26px 64px;background:#14161a;color:#e6e8ec;
  font-family:"Yu Gothic",YuGothic,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  font-size:14px;line-height:1.7}
a{color:#8fb8ff}
a:hover{color:#b6d0ff}
header{max-width:1600px;margin:0 auto 26px;padding-bottom:18px;border-bottom:1px solid #2a2e36;
  display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.02em}
.sub{margin:5px 0 0;color:#878d99;font-size:12px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.chip{font-size:11px;padding:4px 11px;border-radius:20px;border:1px solid #343945;color:#b8bec9}
.chip b{color:#e6e8ec;font-weight:600}
.tools{display:flex;align-items:center;gap:8px}
.tools button{min-height:34px;padding:0 15px;border:1px solid #343945;border-radius:6px;
  background:#1c1f26;color:#b8bec9;font-family:inherit;font-size:12px;cursor:pointer}
.tools button[aria-pressed=true]{border-color:#4a90e2;background:#23304a;color:#dceaff}

.grid{max-width:1600px;margin:0 auto;display:grid;gap:22px;
  grid-template-columns:repeat(var(--cols,3),minmax(0,1fr))}
figure{margin:0;background:#1a1d23;border:1px solid #2a2e36;border-radius:10px;overflow:hidden}
figcaption{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #2a2e36}
.name{font-size:13px;font-weight:600;flex:1}
.open{font-size:12px;text-decoration:none}
/* 案は1画面の大きさで映し、中はその中でスクロールする（画面を切り替える案の 100vh を崩さない） */
.viewport{overflow:hidden;background:#000}
@media (max-width:820px){ .grid{grid-template-columns:1fr} }
.viewport iframe{width:1280px;height:800px;border:0;transform-origin:0 0;display:block}
.screens{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid #2a2e36}
.screens button{min-height:30px;padding:0 12px;border:1px solid #343945;border-radius:15px;
  background:none;color:#b8bec9;font-family:inherit;font-size:12px;cursor:pointer}
.screens button[aria-pressed=true]{border-color:#4a90e2;background:#23304a;color:#dceaff}
.note{margin:0;padding:12px 14px;border-top:1px solid #2a2e36;color:#a2a8b4;font-size:12px}
.note b{color:#e6e8ec}
.act{padding:0 14px 14px}
.pick{width:100%;min-height:38px;border:1px solid #3ddc84;border-radius:6px;
  background:none;color:#3ddc84;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.pick:hover,.pick.on{background:#3ddc84;color:#0b0b0c}
#done{max-width:1600px;margin:18px auto 0;font-size:12.5px;color:#3ddc84;min-height:1.4em}
#refs{max-width:1600px;margin:0 auto 26px;padding-bottom:22px;border-bottom:1px solid #2a2e36}
#refs h2{margin:0;font-size:14px;font-weight:600;color:#b8bec9}
#refs p{margin:6px 0 14px;font-size:12px;color:#878d99;line-height:1.8}
#refs .warn{color:#ffb86b}
.refrow{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.refcard{border:1px solid #2a2e36;border-radius:10px;overflow:hidden;background:#1a1d23;width:220px}
.refcard img{width:100%;display:block;background:#fff}
.refcard .cap{padding:10px 12px;font-size:12px}
.refcard .cap b{display:block;font-size:12.5px;margin-bottom:3px}
.refcard .cap span{color:#878d99;font-size:11px}
.refcard.axis{border-color:#3ddc84}
.refcard.axis .cap b::before{content:"軸 ";color:#3ddc84;font-weight:700}
/* 採用後はこの画面の役目は終わり。一覧を隠して、作成の進み具合と「閉じてよい」だけを出す */
#closed{display:none;max-width:560px;margin:14vh auto 0;padding:0 4px}
body.closed > :not(#closed):not(script){display:none}
body.closed #closed{display:block}
#closed h1{font-size:19px;margin-bottom:14px}
#closed p{margin:0 0 12px;color:#b8bec9;font-size:13.5px;line-height:1.9}
#closed .muted{color:#878d99;font-size:12.5px}
#closed code{font-family:Consolas,monospace;font-size:12.5px;padding:1px 6px;border-radius:4px;
  background:#23262e;color:#e6e8ec}
#closed .go{display:inline-block;margin:6px 0 18px;padding:10px 20px;border-radius:6px;
  background:#3ddc84;color:#0b0b0c;font-weight:700;text-decoration:none}
#closed .go:hover{color:#0b0b0c;background:#5ce69a}
#closed .err{color:#ff8a80}
#closed button{min-height:36px;padding:0 16px;border:1px solid #343945;border-radius:6px;
  background:#1c1f26;color:#e6e8ec;font-family:inherit;font-size:12.5px;cursor:pointer}
#empty{max-width:1600px;margin:0 auto;color:#878d99;font-size:13px;line-height:1.9}
footer{max-width:1600px;margin:30px auto 0;padding-top:18px;border-top:1px solid #2a2e36;
  color:#878d99;font-size:12px}
</style>
</head>
<body>

<header>
  <div>
    <h1 id="title">生成案の比較</h1>
    <p class="sub" id="sub"></p>
    <div class="meta" id="meta"></div>
  </div>
  <div class="tools">
    <button type="button" id="w" aria-pressed="true" onclick="setW(1280)">デスクトップ</button>
    <button type="button" id="m" aria-pressed="false" onclick="setW(430)">モバイル</button>
  </div>
</header>

<section id="refs" style="display:none">
  <h2 id="refTitle"></h2>
  <p id="refNote"></p>
  <div class="refrow" id="refRow"></div>
</section>

<div class="grid" id="grid"></div>
<p id="empty"></p>
<p id="done"></p>

<section id="closed" aria-live="polite"></section>

<footer>選別画面に戻る: <a href="picker.html">picker.html</a></footer>

<script>
/* 案の中身はプロジェクト側にある。ここは器だけで、開くたびに読み直す。
   生成ジョブが .design/gen/variants.json を書くので、それを正とする。 */
let VARIANTS = [];

async function get(u, fallback){
  try{
    const r = await fetch(u, {cache:"no-store"});
    if(!r.ok) throw 0;
    return await r.json();
  }catch(e){ return fallback; }
}

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
}

async function boot(){
  // 採用済み（作成中・作成済み）なら一覧は出さない
  const d0 = await get("/api/decision", {});
  if(d0.job === "running" || d0.built){ return showClosed(d0); }

  const [picks, req, man, dec] = await Promise.all([
    get("/api/picks", {picks:[]}),
    get("/api/request", {}),
    get("/gen/variants.json", null),
    get("/api/decision", {})
  ]);

  // 役割は廃止したので、並び順で示す（先頭が軸）
  const refs = (picks.picks || [])
    .map((p, i) => (i === 0 ? "軸: " : "＋ ") + p.name).join(" ／ ");
  document.getElementById("sub").textContent = refs || "参照未選択";

  VARIANTS = (man && man.variants) || [];
  if(!VARIANTS.length){
    // manifest が無い場合は gen/ の並びだけで出す
    VARIANTS = ["a","b"].slice(0, req.variants || 2).map(id => ({id}));
  }

  const grid = document.getElementById("grid");
  grid.style.setProperty("--cols", Math.min(VARIANTS.length, 3));
  grid.innerHTML = VARIANTS.map(v => {
    const label = v.label ? "案" + v.id.toUpperCase() + "　" + esc(v.label)
                          : "案" + v.id.toUpperCase();
    // 案a＝参照の配置に近い、案b＝雰囲気のまま内容に合わせて組む（serve.py の VARIANTS）
    const lean = {a:"参照の配置に近づけた案", b:"雰囲気のまま、内容に合わせて組んだ案"}[v.id] || "";
    const note = lean ? "<b>" + lean + "</b>" : "";
    return '<figure>' +
      '<figcaption><span class="name">' + label + '</span>' +
      '<a class="open" href="/gen/' + v.id + '/" target="_blank" rel="noopener">開く ↗</a></figcaption>' +
      screens(v) +
      '<div class="viewport"><iframe src="/gen/' + v.id + '/" title="' + esc(label) + '" loading="lazy"></iframe></div>' +
      '<p class="note">' + note + (note && v.note ? "<br>" : "") + esc(v.note || "") + '</p>' +
      '<div class="act"><button class="pick" data-v="' + v.id + '">この案で実装する</button></div>' +
      '</figure>';
  }).join("");

  // 画面を切り替える案は、画面ごとに見られるようにする
  grid.querySelectorAll(".screens button").forEach(b => {
    b.onclick = () => {
      const fig = b.closest("figure");
      fig.querySelector("iframe").src = "/gen/" + b.dataset.v + "/#" + b.dataset.p;
      fig.querySelectorAll(".screens button").forEach(x =>
        x.setAttribute("aria-pressed", x === b));
    };
  });

  grid.querySelectorAll(".pick").forEach(b => {
    b.onclick = () => decide(b);
    if(dec && dec.variant === b.dataset.v){
      b.classList.add("on"); b.textContent = "この案で実装する（選択中）";
    }
  });

  document.getElementById("empty").textContent = VARIANTS.length
    ? "" : "まだ案がありません。picker.html で参照を選び、「決定」を押してください。";

  renderRefs(picks, req);
  setW(1280);
}

/* 何を選んで何が出たかを一目で見せる。
   選んだ参照が隣に無いと、寄っているのか離れているのか判断できない。 */
function renderRefs(picks, req){
  const list = (picks && picks.picks) || [];
  if(!list.length) return;
  document.getElementById("refTitle").textContent = "選んだ参照";

  // 上部の切り抜きしか無い参照は、ページ全体の組み方までは写せない
  const head = list[0] && list[0].src && list[0].src !== "GODLY";
  document.getElementById("refNote").innerHTML = head
    ? "この参照はページ上部の画像しか手元に無いので、2画面目以降の組み方は参照の雰囲気から広げています。"
    : "";

  document.getElementById("refRow").innerHTML = list.map(function(p, i){
    return '<div class="refcard' + (i === 0 ? ' axis' : '') + '">' +
      '<img src="/ref/' + esc(p.id) + '" alt="">' +
      '<div class="cap"><b>' + esc(p.name || p.id) + '</b>' +
      '<span>' + esc(p.src || "") + (p.hint ? " ／ " + esc(p.hint) : "") + '</span></div>' +
      '</div>';
  }).join("");
  document.getElementById("refs").style.display = "block";
}

async function decide(btn){
  const v = btn.dataset.v;
  const found = VARIANTS.find(x => x.id === v) || {};
  if(!confirm("案" + v.toUpperCase() + " で本番のページを作ります。\n" +
      "決めたあとはこの比較画面と picker は閉じます（選び直すときは /design-dna:start から）。"))
    return;
  document.querySelectorAll(".pick").forEach(b => b.disabled = true);
  try{
    const r = await fetch("/api/decision", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({variant:v, path:"gen/"+v+"/", label:found.label || ""})});
    const d = await r.json().catch(() => ({}));
    if(r.status === 409){ return showClosed(await get("/api/decision", {})); }
    if(!r.ok) throw 0;
    if(!d.job){
      document.getElementById("done").textContent = "作成を始められませんでした: " + (d.message || "");
      document.querySelectorAll(".pick").forEach(b => b.disabled = false);
      return;
    }
    showClosed({variant:v, label:found.label || "", out:d.out, job:"running"});
  }catch(e){
    document.getElementById("done").textContent = "サーバに届きませんでした";
    document.querySelectorAll(".pick").forEach(b => b.disabled = false);
  }
}

/* 採用後の画面。作っている間は進み具合を出し、できたらそのページへ切り替える。
   この回の picker / compare はここで役目を終える。 */
async function showClosed(d){
  document.body.classList.add("closed");
  document.title = "採用済み";
  const box = document.getElementById("closed");
  const name = "案" + String(d.variant || "").toUpperCase() + (d.label ? "「" + esc(d.label) + "」" : "");
  const again = '<p class="muted">この画面はもう使いません。タブを閉じて大丈夫です。<br>' +
    '選び直したくなったら、Claude Code で <code>/design-dna:start</code> を呼んでください。</p>';
  const url = d.out ? "/project/" + d.out : "";

  if(d.built){
    box.innerHTML = '<h1>' + name + ' で作りました</h1>' +
      '<p><code>' + esc(d.out) + '</code> に書き出しました。</p>' +
      '<a class="go" href="' + esc(url) + '">ページを開く →</a>' + again;
    return;
  }
  if(d.job === "error"){
    const s = await get("/api/job?name=implement", {});
    box.innerHTML = '<h1 class="err">' + name + ' のページを作れませんでした</h1>' +
      '<p class="muted">' + esc((s.message || "サーバが再起動されて、作成が途中で止まりました。").slice(0, 300)) + '</p>' +
      '<p><button type="button" onclick="location.reload()">比較画面に戻る</button></p>';
    return;
  }

  const t0 = Date.now();
  for(;;){
    const sec = Math.round((Date.now() - t0) / 1000);
    box.innerHTML = '<h1>' + name + ' で本番のページを作っています…</h1>' +
      '<p>' + (d.out ? '<code>' + esc(d.out) + '</code> に書き出します。' : '') +
      'できたらこのタブがそのページに切り替わります。' + (sec ? '（' + sec + '秒）' : '') + '</p>' +
      '<p class="muted">数分かかります。タブを閉じても作成は続きます。<br>' +
      '選び直したくなったら、Claude Code で <code>/design-dna:start</code> を呼んでください。</p>';
    await new Promise(r => setTimeout(r, 3000));
    const s = await get("/api/decision", null);
    if(!s) continue;
    if(s.built && s.job !== "running"){ location.href = "/project/" + s.out; return; }
    if(s.job !== "running"){
      // idle はサーバが再起動されて途切れたとき。done なのにファイルが無いのは書けずに終わったとき
      return showClosed(Object.assign({}, d, {job:"error"}));
    }
  }
}

function screens(v){
  const ps = v.pages || [];
  if(ps.length < 2) return "";
  return '<div class="screens" role="group" aria-label="画面">' + ps.map((p, i) =>
    '<button type="button" data-v="' + v.id + '" data-p="' + esc(p.id) + '" aria-pressed="' + (i === 0) + '">' +
    esc(p.label || p.id) + '</button>').join("") + '</div>';
}

function setW(px){
  // 実際の1画面（デスクトップ 1280x800 / スマホ 430x932）の大きさで映す
  const h = px >= 1000 ? 800 : 932;
  document.querySelectorAll(".viewport").forEach(vp => {
    const f = vp.querySelector("iframe");
    if(!f) return;
    const k = Math.min(vp.clientWidth / px, px >= 1000 ? 1 : 640 / h);
    f.style.width = px + "px";
    f.style.height = h + "px";
    f.style.transform = "scale(" + k + ")";
    f.style.marginLeft = Math.max(0, (vp.clientWidth - px * k) / 2) + "px";
    vp.style.height = Math.round(h * k) + "px";
  });
  document.getElementById("w").setAttribute("aria-pressed", px >= 1000);
  document.getElementById("m").setAttribute("aria-pressed", px < 1000);
}

addEventListener("resize", () => {
  setW(document.getElementById("m").getAttribute("aria-pressed") === "true" ? 430 : 1280);
});
boot();
</script>
</body>
</html>
