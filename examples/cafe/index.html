<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe Little Leaf</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ヘッダー：店名とキャッチコピー -->
  <header>
    <h1>Cafe Little Leaf</h1>
    <p>小さな葉っぱのような、ひと休みを。</p>
  </header>

  <main>

    <!-- 営業時間 -->
    <section>
      <h2>営業時間</h2>
      <p>平日 8:00 - 19:00</p>
      <p>土日祝 9:00 - 18:00</p>
      <p>定休日：水曜日</p>
    </section>

    <!-- おすすめメニュー3つ -->
    <section>
      <h2>おすすめメニュー</h2>
      <ul>
        <li>
          <h3>リーフブレンド</h3>
          <p>浅煎りの豆を使った、すっきり飲みやすい看板コーヒー。</p>
        </li>
        <li>
          <h3>季節のフルーツタルト</h3>
          <p>その日仕入れた果物をたっぷりのせた、日替わりのタルト。</p>
        </li>
        <li>
          <h3>自家製レモンソーダ</h3>
          <p>はちみつ漬けレモンを炭酸で割った、暑い日のおすすめ。</p>
        </li>
      </ul>
    </section>

    <!-- 予約ボタン -->
    <section>
      <button type="button">予約する</button>
    </section>

  </main>

  <!-- フッター：住所とコピーライト -->
  <footer>
    <p>〒150-0001 東京都渋谷区神宮前1-2-3 リトルリーフビル 1F</p>
    <p>&copy; 2026 Cafe Little Leaf</p>
  </footer>

</body>
</html>
