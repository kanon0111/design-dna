<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe Little Leaf ｜ 案B 構図を崩しグリッドへ振る</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="hero">
    <div class="wrap g">
      <h1>Cafe<br>Little Leaf</h1>
      <p class="sub">小さな葉っぱのような、ひと休みを。東京・神宮前の小さな喫茶店です。</p>
    </div>
  </header>

  <main>

    <section class="hours">
      <div class="wrap g">
        <p class="label">Hours</p>
        <h2>あいている時間</h2>
        <table>
          <tbody>
            <tr><th>平日</th><td>8:00 – 19:00</td></tr>
            <tr><th>土日祝</th><td>9:00 – 18:00</td></tr>
            <tr><th>定休日</th><td>水曜日</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="menu">
      <div class="wrap">
        <div class="g"><h2>おすすめ</h2></div>
        <div class="items">
          <article class="item">
            <figure><div class="ph m"></div></figure>
            <h3>リーフブレンド</h3>
            <p>浅煎りの豆を使った、すっきり飲みやすい看板コーヒー。</p>
          </article>
          <article class="item">
            <figure><div class="ph a"></div></figure>
            <h3>季節のフルーツタルト</h3>
            <p>その日仕入れた果物をたっぷりのせた、日替わりのタルト。</p>
          </article>
          <article class="item">
            <figure><div class="ph s"></div></figure>
            <h3>自家製レモンソーダ</h3>
            <p>はちみつ漬けレモンを炭酸で割った、暑い日のおすすめ。</p>
          </article>
        </div>
      </div>
    </section>

    <section class="reserve">
      <div class="wrap g">
        <div class="act"><button class="btn" type="button">予約する</button></div>
        <h2>席をとっておく</h2>
      </div>
    </section>

  </main>

  <footer>
    <div class="wrap g">
      <address>〒150-0001 東京都渋谷区神宮前1-2-3 リトルリーフビル 1F</address>
      <p class="copy">&copy; 2026</p>
    </div>
  </footer>

</body>
</html>
