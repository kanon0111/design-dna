<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe Little Leaf</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main>

    <section class="open">
      <p class="tagline">小さな葉っぱのような、<br>ひと休みを。</p>
    </section>

    <hr>

    <section class="menu">
      <h2>おすすめメニュー</h2>

      <article>
        <div class="tone tone-leaf"></div>
        <h3>リーフブレンド</h3>
        <p>浅煎りの豆を使った、すっきり飲みやすい看板コーヒー。</p>
      </article>

      <article>
        <div class="tone tone-fruit"></div>
        <h3>季節のフルーツタルト</h3>
        <p>その日仕入れた果物をたっぷりのせた、日替わりのタルト。</p>
      </article>

      <article>
        <div class="tone tone-lemon"></div>
        <h3>自家製レモンソーダ</h3>
        <p>はちみつ漬けレモンを炭酸で割った、暑い日のおすすめ。</p>
      </article>
    </section>

    <hr>

    <section class="hours">
      <h2>営業時間</h2>
      <p>平日 8:00 - 19:00</p>
      <p>土日祝 9:00 - 18:00</p>
      <p>定休日：水曜日</p>
      <p class="book"><button type="button">予約する</button></p>
    </section>

    <hr>

    <footer>
      <h1>Cafe Little Leaf</h1>
      <p class="place">〒150-0001 東京都渋谷区神宮前1-2-3<br>リトルリーフビル 1F</p>
      <p class="copy">&copy; 2026 Cafe Little Leaf</p>
    </footer>

  </main>

</body>
</html>
