<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe Little Leaf</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="sheet">

    <!-- 左下から右上へ、5つの塊が段を上がっていく -->
    <header class="block step1">
      <h1>Cafe&nbsp;Little<br>Leaf</h1>
      <p class="lede">小さな葉っぱのような、ひと休みを。</p>
    </header>

    <section class="block step2">
      <h2>おすすめメニュー</h2>
      <dl class="menu">
        <div class="item">
          <dt>リーフブレンド</dt>
          <dd>浅煎りの豆を使った、すっきり飲みやすい看板コーヒー。</dd>
        </div>
        <div class="item">
          <dt>季節のフルーツタルト</dt>
          <dd>その日仕入れた果物をたっぷりのせた、日替わりのタルト。</dd>
        </div>
        <div class="item">
          <dt>自家製レモンソーダ</dt>
          <dd>はちみつ漬けレモンを炭酸で割った、暑い日のおすすめ。</dd>
        </div>
      </dl>
    </section>

    <section class="block step3">
      <h2>営業時間</h2>
      <p class="hour">平日 8:00 - 19:00</p>
      <p class="hour">土日祝 9:00 - 18:00</p>
      <p class="hour">定休日：水曜日</p>
    </section>

    <section class="block step4">
      <button type="button">予約する</button>
    </section>

    <footer class="block step5">
      <p>〒150-0001 東京都渋谷区神宮前1-2-3 リトルリーフビル 1F</p>
      <p class="copy">&copy; 2026 Cafe Little Leaf</p>
    </footer>

  </div>

</body>
</html>
