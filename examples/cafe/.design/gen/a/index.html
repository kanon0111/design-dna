<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe Little Leaf</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="grid">

    <section class="plate p-name">
      <h1>Cafe<br>Little<br>Leaf</h1>
    </section>

    <section class="plate p-hours">
      <h2>営業時間</h2>
      <div class="clockset">
        <p class="clock">8:00–19:00</p>
        <p class="when">平日</p>
      </div>
      <div class="clockset">
        <p class="clock">9:00–18:00</p>
        <p class="when">土日祝</p>
      </div>
      <p class="when closed">定休日：水曜日</p>
    </section>

    <section class="plate p-tag">
      <p class="tagline">小さな葉っぱのような、<br>ひと休みを。</p>
    </section>

    <section class="plate p-head">
      <h2>おすすめメニュー</h2>
    </section>

    <article class="plate p-m1">
      <div class="tone tone-leaf"></div>
      <div class="pad">
        <h3>リーフブレンド</h3>
        <p>浅煎りの豆を使った、すっきり飲みやすい看板コーヒー。</p>
      </div>
    </article>

    <article class="plate p-m2">
      <div class="tone tone-fruit"></div>
      <div class="pad">
        <h3>季節のフルーツタルト</h3>
        <p>その日仕入れた果物をたっぷりのせた、日替わりのタルト。</p>
      </div>
    </article>

    <article class="plate p-m3">
      <div class="tone tone-lemon"></div>
      <div class="pad">
        <h3>自家製レモンソーダ</h3>
        <p>はちみつ漬けレモンを炭酸で割った、暑い日のおすすめ。</p>
      </div>
    </article>

    <section class="plate p-book">
      <button type="button">予約する</button>
    </section>

    <section class="plate p-addr">
      <p class="mark">CAFE LITTLE LEAF</p>
      <p>〒150-0001 東京都渋谷区神宮前1-2-3<br>リトルリーフビル 1F</p>
      <p class="copy">&copy; 2026 Cafe Little Leaf</p>
    </section>

  </main>

</body>
</html>
